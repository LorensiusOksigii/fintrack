services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Database utama
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fintrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_password}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Data persisten — tidak hilang saat container restart
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack_user} -d ${POSTGRES_DB:-fintrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrack_network

  # ---------------------------------------------------------------------------
  # pgAdmin — GUI untuk inspect database (opsional, hanya development)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fintrack_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fintrack.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fintrack_network
    profiles:
      # pgAdmin hanya jalan jika eksplisit diaktifkan:
      # docker compose --profile tools up -d
      - tools

# ---------------------------------------------------------------------------
# Volumes & Networks
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  fintrack_network:
    driver: bridge
