# Alembic Configuration File
# Dokumentasi: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path ke folder migrations
script_location = app/migrations

# Template untuk nama file migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone untuk timestamp migration
timezone = Asia/Jakarta

# Database URL — diambil dari env variable saat runtime (lihat app/migrations/env.py)
# Tidak perlu diisi di sini karena kita pakai pydantic-settings
sqlalchemy.url =

[post_write_hooks]
# (opsional) Auto-format file migration setelah dibuat
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
